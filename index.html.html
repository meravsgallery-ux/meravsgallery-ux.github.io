<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>גלריה — ציורים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wall:#FBF6EC;
    --wall-soft:#F1E6CF;
    --ink:#2B2115;
    --frame:#C68A3D;
    --frame-dark:#8A5A22;
    --accent:#6E4A85;
    --accent-soft:#8B6BA8;
    --leaf:#6F7F4B;
    --muted:#7C6F58;
    --card-bg:#FFFDF7;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --wall:#211C15; --wall-soft:#2A2319; --ink:#F1E9D8; --frame:#D9A758;
      --frame-dark:#96692F; --accent:#B48FCB; --accent-soft:#8B6BA8; --leaf:#9DAF77;
      --muted:#BBAE92; --card-bg:#2A2319;
    }
  }
  :root[data-theme="dark"]{
    --wall:#211C15; --wall-soft:#2A2319; --ink:#F1E9D8; --frame:#D9A758;
    --frame-dark:#96692F; --accent:#B48FCB; --accent-soft:#8B6BA8; --leaf:#9DAF77;
    --muted:#BBAE92; --card-bg:#2A2319;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    background:var(--wall);
    color:var(--ink);
    font-family:'Assistant',sans-serif;
    line-height:1.6;
    min-height:100%;
  }
  img{max-width:100%;display:block;}

  header.hero{
    position:relative;
    min-height:min(78vh,640px);
    display:flex;
    align-items:flex-end;
    padding:2rem 1.5rem 3.2rem;
    background-size:cover;
    background-position:center 30%;
    isolation:isolate;
  }
  header.hero::before{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(0deg, rgba(20,14,8,.82) 0%, rgba(20,14,8,.25) 55%, rgba(20,14,8,.05) 100%);
    z-index:-1;
  }
  .hero-inner{max-width:640px;margin:0 auto;text-align:center;color:#FBF6EC;}
  .eyebrow{
    font-size:.95rem;
    color:#E7D9C2;
    letter-spacing:.02em;
    margin-bottom:.6rem;
  }
  h1{
    font-family:'Frank Ruhl Libre',serif;
    font-weight:700;
    font-size:clamp(2.2rem,6vw,3.6rem);
    color:#FFFDF7;
    margin-bottom:1rem;
  }
  .intro{
    max-width:36ch;
    margin:0 auto;
    color:#EFE4CF;
    font-size:1.05rem;
    font-weight:300;
  }

  main{max-width:1180px;margin:0 auto;padding:2.4rem 1.5rem 5rem;}

  .section-divider{
    height:4px;
    max-width:120px;
    margin:0 auto 2.6rem;
    background:linear-gradient(90deg, var(--accent), var(--leaf), var(--frame));
    border-radius:4px;
  }

  .wall{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:2.4rem 1.8rem;
  }

  .piece{
    cursor:pointer;
    background:none;
    border:none;
    text-align:right;
    font:inherit;
    color:inherit;
  }
  .frame{
    background:var(--card-bg);
    padding:.9rem;
    border:1px solid color-mix(in srgb, var(--frame) 40%, transparent);
    box-shadow:0 1px 0 rgba(0,0,0,.04), 0 10px 24px -18px rgba(0,0,0,.35);
    transition:transform .35s ease, box-shadow .35s ease;
  }
  .piece:hover .frame{
    transform:translateY(-4px);
    box-shadow:0 1px 0 rgba(0,0,0,.05), 0 22px 34px -20px rgba(0,0,0,.4);
  }
  .frame .canvas{
    width:100%;
    aspect-ratio:4/5;
    overflow:hidden;
    border:10px solid var(--frame);
    outline:1px solid var(--frame-dark);
    outline-offset:-1px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg, var(--wall-soft), var(--wall));
  }
  .frame .canvas img{width:100%;height:100%;object-fit:cover;}
  .placeholder-mark{
    font-family:'Frank Ruhl Libre',serif;
    font-size:2.6rem;
    color:var(--frame);
    opacity:.5;
  }
  .placard{
    margin-top:.7rem;
    padding-top:.6rem;
    border-top:1px solid color-mix(in srgb, var(--frame) 35%, transparent);
  }
  .placard .title{
    font-family:'Frank Ruhl Libre',serif;
    font-size:1.02rem;
    margin-bottom:.15rem;
  }
  .placard .meta{
    font-size:.82rem;
    color:var(--accent-soft);
    font-variant:small-caps;
    letter-spacing:.03em;
  }

  footer{
    text-align:center;
    padding:3.5rem 1.5rem 4.5rem;
    color:var(--muted);
    font-size:.9rem;
  }
  footer .contact-title{
    font-family:'Frank Ruhl Libre',serif;
    font-size:1.3rem;
    color:var(--ink);
    margin-bottom:.5rem;
  }
  footer a.email{
    color:var(--accent);
    text-decoration:none;
    font-weight:600;
    border-bottom:1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  }
  footer a.email:hover{border-bottom-color:var(--accent);}

  /* Lightbox */
  .lightbox{
    position:fixed;inset:0;
    background:rgba(20,16,12,.92);
    display:none;
    align-items:center;
    justify-content:center;
    padding:2rem 1.2rem;
    z-index:50;
  }
  .lightbox.open{display:flex;}
  .lightbox-inner{
    max-width:min(90vw,820px);
    width:100%;
    text-align:center;
  }
  .lightbox-frame{
    background:var(--card-bg);
    padding:1.2rem;
    border:10px solid var(--frame);
  }
  .lightbox-frame img{width:100%;max-height:65vh;object-fit:contain;background:var(--wall-soft);}
  .lightbox-caption{color:#EDE6D8;margin-top:1.1rem;}
  .lightbox-caption .title{font-family:'Frank Ruhl Libre',serif;font-size:1.3rem;}
  .lightbox-caption .meta{font-size:.9rem;opacity:.75;margin-top:.2rem;}
  .lightbox-close{
    position:absolute;
    top:calc(env(safe-area-inset-top,0px) + 1rem);
    left:1.2rem;
    background:none;border:none;
    color:#EDE6D8;font-size:1.8rem;
    cursor:pointer;line-height:1;
    padding:.3rem .6rem;
  }
  .lightbox-close:focus-visible,.piece:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

  @media (max-width:520px){
    header.hero{min-height:82vh;padding:1.6rem 1.2rem 2.4rem;}
    .wall{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1.6rem 1.1rem;}
  }
  @media (prefers-reduced-motion: reduce){
    .piece:hover .frame{transform:none;}
  }
</style>
</head>

  <div class="hero-inner">
    <div class="eyebrow">גלריה דיגיטלית</div>
    <h1 id="artist-name">מירב ברעם</h1>
    <p class="intro" id="artist-intro">אוסף עבודות שנוצרו לאורך השנים — שמן, אקוורל ופחם על בד ונייר.</p>

<main>
  <div class="section-divider"></div>
  <div class="wall" id="wall"></div>
</main>

<footer>
  <div class="contact-title">יצירת קשר</div>
  <p id="footer-note">לפרטים ולהזמנת עבודות ניתן לפנות ל-<a class="email" href="mailto:meravsgallery@gmail.com">meravsgallery@gmail.com</a></p>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="סגירה">&times;</button>
  <div class="lightbox-inner">
    <div class="lightbox-frame">
      <img id="lightboxImg" src="" alt="">
    </div>
    <div class="lightbox-caption">
      <div class="title" id="lightboxTitle"></div>
      <div class="meta" id="lightboxMeta"></div>
    </div>
  </div>
</div>

<script>
/* ===================================================================
   איך להוסיף ציורים אמיתיים (ב-GitHub):
   1. צרי תיקייה בשם images והעלי אליה קבצי תמונה בשמות:
      ציור1.jpg, ציור2.jpg, ציור3.jpg ... (עד ציור12.jpg)
   2. זהו — האתר ימצא אותן אוטומטית. כל עוד תמונה לא הועלתה,
      תוצג מסגרת ריקה עם מספר במקומה.
   3. אפשר גם לערוך כאן את title / medium / year לכל ציור.
   =================================================================== */
const artworks = [
  { title:"ללא כותרת 1", medium:"שמן על בד", year:"", image:"images/ציור1.jpg" },
  { title:"ללא כותרת 2", medium:"אקוורל על נייר", year:"", image:"images/ציור2.jpg" },
  { title:"ללא כותרת 3", medium:"שמן על בד", year:"", image:"images/ציור3.jpg" },
  { title:"ללא כותרת 4", medium:"פחם על נייר", year:"", image:"images/ציור4.jpg" },
  { title:"ללא כותרת 5", medium:"שמן על בד", year:"", image:"images/ציור5.jpg" },
  { title:"ללא כותרת 6", medium:"אקוורל על נייר", year:"", image:"images/ציור6.jpg" },
  { title:"ללא כותרת 7", medium:"שמן על בד", year:"", image:"images/ציור7.jpg" },
  { title:"ללא כותרת 8", medium:"אקריליק על בד", year:"", image:"images/ציור8.jpg" },
  { title:"ללא כותרת 9", medium:"שמן על בד", year:"", image:"images/ציור9.jpg" },
  { title:"ללא כותרת 10", medium:"אקוורל על נייר", year:"", image:"images/ציור10.jpg" },
  { title:"ללא כותרת 11", medium:"שמן על בד", year:"", image:"images/ציור11.jpg" },
  { title:"ללא כותרת 12", medium:"פחם על נייר", year:"", image:"images/ציור12.jpg" },
];

const wall = document.getElementById('wall');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxTitle = document.getElementById('lightboxTitle');
const lightboxMeta = document.getElementById('lightboxMeta');

function metaLine(a){ return [a.medium, a.year].filter(Boolean).join(' · '); }

artworks.forEach((a, i)=>{
  const btn = document.createElement('button');
  btn.className = 'piece';
  btn.setAttribute('aria-label', 'הצגת ' + a.title + ' בהגדלה');

  btn.innerHTML = `
    <div class="frame">
      <div class="canvas">
        <span class="placeholder-mark">${i+1}</span>
        <img src="${a.image}" alt="${a.title}" style="display:none"
             onload="this.style.display='block'; this.previousElementSibling.style.display='none';">
      </div>
      <div class="placard">
        <div class="title">${a.title}</div>
        <div class="meta">${metaLine(a)}</div>
      </div>
    </div>
  `;
  btn.addEventListener('click', ()=>{
    const imgEl = btn.querySelector('img');
    const hasImage = imgEl.style.display !== 'none';
    lightboxImg.src = hasImage ? a.image : '';
    lightboxImg.alt = a.title;
    lightboxImg.style.display = hasImage ? 'block' : 'none';
    lightboxTitle.textContent = a.title;
    lightboxMeta.textContent = metaLine(a);
    lightbox.classList.add('open');
  });
  wall.appendChild(btn);
});

document.getElementById('lightboxClose').addEventListener('click', ()=> lightbox.classList.remove('open'));
lightbox.addEventListener('click', (e)=>{ if(e.target===lightbox) lightbox.classList.remove('open'); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') lightbox.classList.remove('open'); });
</script>
</body>
</html>
